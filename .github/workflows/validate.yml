name: validate-gitops
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint charts/microservice
      - name: Render all services
        run: |
          for service in nginx python java; do
            helm template "$service" charts/microservice -f "services/$service/values.yaml" > "/tmp/$service.yaml"
          done
      - name: Reject obvious plaintext secrets
        run: |
          if grep -RniE '^[[:space:]]*(password|api[_-]?key|secret)[[:space:]]*:[[:space:]]*[^$\{]' \
            charts services platform argocd 2>/dev/null; then
            echo 'Potential plaintext secret detected'; exit 1
          fi
